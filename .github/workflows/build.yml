name: Build Windows Widget

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build ResourceWidget.exe
        run: |
          pyinstaller --onefile --noconsole --name ResourceWidget resource_widget.py

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ResourceWidget-windows-exe
          path: dist/ResourceWidget.exe
          if-no-files-found: error
          retention-days: 30

      # Only runs when you push a tag like v1.0.0 - creates a GitHub Release
      # with the exe attached, ready for download.
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/ResourceWidget.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
